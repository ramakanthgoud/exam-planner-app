<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Planner</title>
<style>
:root{--green:#86bc25;--dark:#17202a;--light:#f5f7f9;--border:#dfe4e8}
*{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--dark);font:16px Arial,sans-serif}
header{background:var(--dark);color:white;padding:24px 16px;text-align:center}
main{max-width:720px;margin:auto;padding:20px 16px}.card{background:white;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
h1,h2{margin-top:0}label{display:block;font-weight:bold;margin:14px 0 6px}
input,button{font:inherit;width:100%;padding:12px;border-radius:8px}
input{border:1px solid #aeb8c2}button{border:0;background:var(--green);color:#142000;font-weight:bold;cursor:pointer;margin-top:16px}
button.secondary{background:#e9edf0;color:var(--dark)}button.danger{background:#f5d6d3;color:#8b1e17}
nav{display:flex;gap:8px;margin-bottom:16px}nav button{margin:0;background:var(--dark);color:white}
nav button.active{background:var(--green);color:#142000}.hidden{display:none}.topic-row{display:flex;gap:8px;margin-top:8px}
.topic-row input{flex:1}.topic-row button{width:48px;margin:0;background:#e9edf0}.subject{border-top:1px solid var(--border);padding-top:14px;margin-top:16px}
.task{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:12px 0}
.task input{width:auto}.done{text-decoration:line-through;color:#6b7780}.stat{font-size:28px;font-weight:bold;color:#527b00}
.message{padding:10px;background:#fff3cd;border-radius:8px;margin-top:12px}
</style>
</head>
<body>
<header><h1>Exam Planner</h1><p>Simple planning for your next exam</p></header>
<main>
<section id="setup" class="card">
<h2>Create your plan</h2>
<label for="examName">Exam name</label>
<input id="examName" placeholder="Example: Mathematics">
<label for="examDate">Exam date</label>
<input id="examDate" type="date">
<label for="dailyHours">Study hours per day</label>
<input id="dailyHours" type="number" min="1" max="12" value="2">
<h3>Subjects and topics</h3>
<div id="subjects"></div>
<button type="button" onclick="addSubject()">Add subject</button>
<button type="button" onclick="createPlan()">Create study plan</button>
<div id="setupMessage"></div>
</section>

<section id="app" class="hidden">
<nav>
<button id="todayButton" class="active" onclick="showPage('today')">Today</button>
<button id="progressButton" onclick="showPage('progress')">Progress</button>
</nav>
<div id="today" class="card"></div>
<div id="progress" class="card hidden"></div>
<button class="secondary" onclick="editPlan()">Edit plan</button>
<button class="danger" onclick="resetPlan()">Reset all data</button>
</section>
</main>
<script>
const key="examPlannerData";
let data=JSON.parse(localStorage.getItem(key)||"null");

function addSubject(){
 const box=document.createElement("div");box.className="subject";
 box.innerHTML='<input class="subject-name" placeholder="Subject name"><div class="topics"></div><button type="button" class="secondary" onclick="addTopic(this)">Add topic</button>';
 document.getElementById("subjects").appendChild(box);addTopic(box.querySelector("button"));
}
function addTopic(button){
 const row=document.createElement("div");row.className="topic-row";
 row.innerHTML='<input class="topic-name" placeholder="Topic name"><button type="button" onclick="this.parentElement.remove()">×</button>';
 button.previousElementSibling.appendChild(row);
}
function createPlan(){
 const name=document.getElementById("examName").value.trim(),date=document.getElementById("examDate").value;
 const subjects=[...document.querySelectorAll(".subject")].map(s=>({name:s.querySelector(".subject-name").value.trim(),topics:[...s.querySelectorAll(".topic-name")].map(t=>t.value.trim()).filter(Boolean)})).filter(s=>s.name&&s.topics.length);
 if(!name||!date||!subjects.length){document.getElementById("setupMessage").innerHTML='<div class="message">Enter an exam name, date, subject, and at least one topic.</div>';return}
 const topics=subjects.flatMap(s=>s.topics.map(t=>({subject:s.name,topic:t})));
 const days=Math.max(1,Math.ceil((new Date(date)-new Date())/86400000)),tasks=topics.map((x,i)=>({...x,id:i,done:false,day:i%days}));
 data={name,date,hours:document.getElementById("dailyHours").value,subjects,tasks};save();render();
}
function save(){localStorage.setItem(key,JSON.stringify(data))}
function render(){
 document.getElementById("setup").classList.add("hidden");document.getElementById("app").classList.remove("hidden");showPage("today");
}
function showPage(page){
 document.getElementById("today").classList.toggle("hidden",page!=="today");document.getElementById("progress").classList.toggle("hidden",page!=="progress");
 document.getElementById("todayButton").classList.toggle("active",page==="today");document.getElementById("progressButton").classList.toggle("active",page==="progress");
 if(page==="today")renderToday();else renderProgress();
}
function renderToday(){
 const days=Math.max(0,Math.ceil((new Date(data.date)-new Date())/86400000));
 const todayTasks=data.tasks.filter(t=>t.day===((new Date().getDate())%Math.max(1,days))).concat(data.tasks.filter(t=>!t.done&&t.day===0));
 document.getElementById("today").innerHTML=`<h2>${data.name}</h2><p><b>${days}</b> days remaining</p><h3>Today's tasks</h3>${todayTasks.length?todayTasks.map(t=>`<label class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${t.id})">${t.subject}: ${t.topic}</label>`).join(""):"<p class='message'>No tasks assigned today.</p>"}`;
}
function toggleTask(id){data.tasks.find(t=>t.id===id).done=!data.tasks.find(t=>t.id===id).done;save();renderToday()}
function renderProgress(){
 const done=data.tasks.filter(t=>t.done).length,total=data.tasks.length,pct=Math.round(done/total*100);
 document.getElementById("progress").innerHTML=`<h2>Progress</h2><p class="stat">${pct}%</p><p>${done} of ${total} topics completed</p>${data.subjects.map(s=>{const ts=data.tasks.filter(t=>t.subject===s.name),d=ts.filter(t=>t.done).length;return `<p><b>${s.name}</b>: ${d}/${ts.length}</p>`}).join("")}`;
}
function editPlan(){localStorage.removeItem(key);location.reload()}
function resetPlan(){if(confirm("Delete this study plan?")){localStorage.removeItem(key);location.reload()}}
if(data)render();else addSubject();
</script>
</body>
</html>
