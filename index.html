
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Planner</title>
<style>
:root{--green:#86bc25;--dark:#17202a;--light:#f5f7f9;--border:#dfe4e8;--muted:#65727d}
*{box-sizing:border-box}
body{margin:0;background:var(--light);color:var(--dark);font:16px Arial,sans-serif}
header{background:var(--dark);color:#fff;padding:24px 16px;text-align:center}
main{max-width:800px;margin:auto;padding:20px 16px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
h1,h2{margin-top:0}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,button{font:inherit;padding:12px;border-radius:8px}
input{width:100%;border:1px solid #aeb8c2}
button{width:100%;border:0;background:var(--green);color:#142000;font-weight:bold;cursor:pointer;margin-top:16px}
button.secondary{background:#e9edf0;color:var(--dark)}
button.danger{background:#f5d6d3;color:#8b1e17}
nav{display:flex;gap:8px;margin-bottom:16px}
nav button{margin:0;background:var(--dark);color:#fff}
nav button.active{background:var(--green);color:#142000}
.hidden{display:none!important}
.subject{border-top:1px solid var(--border);padding-top:14px;margin-top:16px}
.topic-row{display:flex;gap:8px;margin-top:8px}
.topic-row input{flex:1}
.topic-row button{width:48px;margin:0;background:#e9edf0;color:var(--dark)}
.message{padding:10px;background:#fff3cd;border-radius:8px;margin-top:12px}
.task{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:12px 0}
.task input{width:auto}
.task span{font-weight:normal}
.done{text-decoration:line-through;color:var(--muted)}
.status{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.stat{font-size:30px;font-weight:bold;color:#527b00}
.progress-line{height:10px;background:#e7ebee;border-radius:8px;overflow:hidden}
.progress-fill{height:100%;background:var(--green)}
</style>
</head>
<body>
<header>
<h1>Exam Planner</h1>
<p>Simple planning for your next exam</p>
</header>

<main>
<section id="setup" class="card">
<h2>Create your plan</h2>

<label for="examName">Exam name</label>
<input id="examName" placeholder="Example: Mathematics">

<label for="examDate">Exam date</label>
<input id="examDate" type="date">

<label for="dailyHours">Study hours per day</label>
<input id="dailyHours" type="number" min="1" max="12" value="2">

<h3>Subjects and topics</h3>
<div id="subjects"></div>

<button type="button" onclick="addSubject()">Add subject</button>
<button type="button" onclick="createPlan()">Create study plan</button>
<button id="cancelButton" type="button" class="secondary hidden" onclick="cancelEdit()">Cancel</button>
<div id="setupMessage" class="message hidden"></div>
</section>

<section id="app" class="hidden">
<nav>
<button id="todayButton" class="active" onclick="showPage('today')">Today</button>
<button id="progressButton" onclick="showPage('progress')">Progress</button>
</nav>

<div id="today" class="card"></div>
<div id="progress" class="card hidden"></div>

<button class="secondary" onclick="editPlan()">Edit plan</button>
<button class="danger" onclick="resetPlan()">Reset all data</button>
</section>
</main>

<script>
const storageKey="examPlannerData";
const dayMs=86400000;
let data=loadData();

function startOfDay(value){
  const date=new Date(value);
  return new Date(date.getFullYear(),date.getMonth(),date.getDate());
}

function parseDate(value){
  const parts=value.split("-").map(Number);
  return new Date(parts[0],parts[1]-1,parts[2]);
}

function dateKey(value){
  const date=startOfDay(value);
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

function addDays(value,amount){
  const date=startOfDay(value);
  date.setDate(date.getDate()+amount);
  return date;
}

function formatDate(value){
  return parseDate(value).toLocaleDateString();
}

function daysRemaining(examDate){
  return Math.max(0,Math.ceil((parseDate(examDate)-startOfDay(new Date()))/dayMs));
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[char]));
}

function loadData(){
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey)||"null");
    if(!saved)return null;
    saved.tasks=(saved.tasks||[]).map((task,index)=>({
      ...task,
      id:task.id??index,
      date:task.date||dateKey(new Date())
    }));
    return saved;
  }catch(error){
    return null;
  }
}

function save(){
  localStorage.setItem(storageKey,JSON.stringify(data));
}

function showMessage(text){
  const message=document.getElementById("setupMessage");
  message.textContent=text;
  message.classList.remove("hidden");
}

function clearMessage(){
  document.getElementById("setupMessage").classList.add("hidden");
}

function addSubject(subjectName="",topicNames=[]){
  const box=document.createElement("div");
  box.className="subject";
  box.innerHTML='<input class="subject-name" placeholder="Subject name"><div class="topics"></div><button type="button" class="secondary" onclick="addTopic(this)">Add topic</button>';
  box.querySelector(".subject-name").value=subjectName;
  document.getElementById("subjects").appendChild(box);

  if(topicNames.length){
    topicNames.forEach(topic=>addTopic(box.querySelector("button"),topic));
  }else{
    addTopic(box.querySelector("button"));
  }
}

function addTopic(button,topicName=""){
  const row=document.createElement("div");
  row.className="topic-row";
  row.innerHTML='<input class="topic-name" placeholder="Topic name"><button type="button" onclick="this.parentElement.remove()">×</button>';
  row.querySelector(".topic-name").value=topicName;
  button.previousElementSibling.appendChild(row);
}

function collectSubjects(){
  return [...document.querySelectorAll(".subject")]
    .map(subject=>({
      name:subject.querySelector(".subject-name").value.trim(),
      topics:[...subject.querySelectorAll(".topic-name")]
        .map(topic=>topic.value.trim())
        .filter(Boolean)
    }))
    .filter(subject=>subject.name&&subject.topics.length);
}

function createPlan(){
  clearMessage();

  const name=document.getElementById("examName").value.trim();
  const examDate=document.getElementById("examDate").value;
  const subjects=collectSubjects();

  if(!name||!examDate||!subjects.length){
    showMessage("Enter an exam name, exam date, subject, and at least one topic.");
    return;
  }

  if(parseDate(examDate)<startOfDay(new Date())){
    showMessage("Please choose today or a future exam date.");
    return;
  }

  const oldDone=new Map(
    (data?.tasks||[]).map(task=>[
      `${task.subject}|${task.topic}`,
      Boolean(task.done)
    ])
  );

  const firstTopics=subjects.map(subject=>({
    subject:subject.name,
    topic:subject.topics[0]
  }));

  const remainingTopics=subjects.flatMap(subject=>
    subject.topics.slice(1).map(topic=>({
      subject:subject.name,
      topic
    }))
  );

  const totalDays=Math.max(1,daysRemaining(examDate)+1);
  const futureDays=Math.max(1,totalDays-1);
  const planItems=[...firstTopics,...remainingTopics];

  const tasks=planItems.map((item,index)=>{
    let dayIndex=0;

    if(index>=firstTopics.length&&totalDays>1){
      const remainingIndex=index-firstTopics.length;
      dayIndex=1+Math.floor(
        remainingIndex*futureDays/Math.max(1,remainingTopics.length)
      );
      dayIndex=Math.min(totalDays-1,dayIndex);
    }

    return{
      id:index,
      subject:item.subject,
      topic:item.topic,
      date:dateKey(addDays(new Date(),dayIndex)),
      done:oldDone.get(`${item.subject}|${item.topic}`)||false
    };
  });

  data={
    name,
    date:examDate,
    hours:document.getElementById("dailyHours").value,
    subjects,
    tasks
  };

  save();
  render();
}

function render(){
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("cancelButton").classList.add("hidden");
  showPage("today");
}

function showPage(page){
  document.getElementById("today").classList.toggle("hidden",page!=="today");
  document.getElementById("progress").classList.toggle("hidden",page!=="progress");
  document.getElementById("todayButton").classList.toggle("active",page==="today");
  document.getElementById("progressButton").classList.toggle("active",page==="progress");

  if(page==="today")renderToday();
  if(page==="progress")renderProgress();
}

function taskHtml(task,today){
  const overdue=task.date<today&&!task.done;
  const status=task.date===today
    ?"Due today"
    :overdue
      ?"Overdue"
      :`Planned for ${formatDate(task.date)}`;

  return `<label class="task ${task.done?"done":""}">
    <input type="checkbox" ${task.done?"checked":""} onchange="toggleTask(${task.id})">
    <span>
      ${escapeHtml(task.subject)}: ${escapeHtml(task.topic)}
      <small class="status">${status}</small>
    </span>
  </label>`;
}

function renderToday(){
  const today=dateKey(new Date());
  const dueTasks=data.tasks.filter(task=>task.date<=today);
  const allTasks=[...data.tasks].sort((a,b)=>a.date.localeCompare(b.date));

  document.getElementById("today").innerHTML=`
    <h2>${escapeHtml(data.name)}</h2>
    <p><b>${daysRemaining(data.date)}</b> days remaining</p>
    <p>Daily study target: ${escapeHtml(data.hours)} hour(s)</p>
    <h3>Today's tasks</h3>
    ${dueTasks.length
      ?dueTasks.map(task=>taskHtml(task,today)).join("")
      :"<p class='message'>No tasks are due today.</p>"}
    <h3>Complete study plan</h3>
    ${allTasks.map(task=>taskHtml(task,today)).join("")}
  `;
}

function toggleTask(id){
  const task=data.tasks.find(item=>String(item.id)===String(id));
  if(!task)return;
  task.done=!task.done;
  save();
  renderToday();
}

function calculateStreak(){
  const completedDates=new Set(
    data.tasks.filter(task=>task.done).map(task=>task.date)
  );
  let cursor=new Date();
  let streak=0;

  while(completedDates.has(dateKey(cursor))){
    streak++;
    cursor=addDays(cursor,-1);
  }

  return streak;
}

function renderProgress(){
  const total=data.tasks.length;
  const done=data.tasks.filter(task=>task.done).length;
  const percent=total?Math.round(done/total*100):0;

  const subjectHtml=data.subjects.map(subject=>{
    const tasks=data.tasks.filter(task=>task.subject===subject.name);
    const completed=tasks.filter(task=>task.done).length;
    return `<p><b>${escapeHtml(subject.name)}</b>: ${completed}/${tasks.length} topics</p>`;
  }).join("");

  document.getElementById("progress").innerHTML=`
    <h2>Progress</h2>
    <p class="stat">${percent}%</p>
    <div class="progress-line"><div class="progress-fill" style="width:${percent}%"></div></div>
    <p>${done} of ${total} topics completed</p>
    <p><b>Current streak:</b> ${calculateStreak()} day(s)</p>
    <h3>Progress by subject</h3>
    ${subjectHtml}
  `;
}

function editPlan(){
  document.getElementById("app").classList.add("hidden");
  document.getElementById("setup").classList.remove("hidden");
  document.getElementById("cancelButton").classList.remove("hidden");
  clearMessage();

  document.getElementById("examName").value=data.name;
  document.getElementById("examDate").value=data.date;
  document.getElementById("dailyHours").value=data.hours;

  const subjectsBox=document.getElementById("subjects");
  subjectsBox.innerHTML="";
  data.subjects.forEach(subject=>addSubject(subject.name,subject.topics));
}

function cancelEdit(){
  render();
}

function resetPlan(){
  if(confirm("Delete this study plan?")){
    localStorage.removeItem(storageKey);
    location.reload();
  }
}

if(data){
  render();
}else{
  addSubject();
}
</script>
</body>
</html>
